name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Builds against the macOS 26 SDK. Destructive tests only touch generated temporary fixtures.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: bash scripts/test.sh
      - run: bash scripts/release.sh --unsigned
