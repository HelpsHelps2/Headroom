<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- DMG window background, 640×400 points. Icon centers: Headroom (170,176), Applications (470,176).
     Render: scripts/dmg/render-background.sh. Keep in sync with scripts/dmg/settings.py. -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:640px;height:400px;overflow:hidden}
  body{background:#0b0c0e;color:#ededee;font-family:"Geist",system-ui,sans-serif;position:relative}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:32px 32px;background-position:10px 26px;
    mask-image:radial-gradient(ellipse 60% 70% at 50% 46%,#000 10%,transparent 72%)}
  .glow{position:absolute;left:170px;top:176px;width:440px;height:440px;margin:-220px 0 0 -220px;border-radius:50%;
    background:radial-gradient(circle,rgba(230,162,67,.13),rgba(230,162,67,0) 62%)}
  svg{position:absolute;left:0;top:0}
  .copy{position:absolute;left:0;right:0;top:328px;text-align:center}
  .copy b{display:block;font-weight:600;font-size:15px;letter-spacing:-.01em}
  .copy span{display:block;margin-top:7px;font:400 11px "Geist Mono",ui-monospace,monospace;color:#5d636b;letter-spacing:.01em}
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <svg width="640" height="400" viewBox="0 0 640 400" fill="none" aria-hidden="true">
    <defs>
      <linearGradient id="trail" x1="284" y1="0" x2="398" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#e6a243" stop-opacity="0"/>
        <stop offset="1" stop-color="#e6a243"/>
      </linearGradient>
    </defs>
    <!-- Orbit ring around the app icon, as on the site -->
    <circle cx="170" cy="176" r="124" stroke="rgba(255,255,255,.14)" stroke-width="2" stroke-dasharray="1 7.5"/>
    <circle cx="170" cy="176" r="110" stroke="rgba(255,255,255,.06)" stroke-width="7"/>
    <circle cx="170" cy="176" r="110" stroke="#e6a243" stroke-width="7" stroke-linecap="round" pathLength="1000" stroke-dasharray="620 1000" transform="rotate(-90 170 176)"/>
    <!-- Landing slot for the Applications folder -->
    <circle cx="470" cy="176" r="110" stroke="rgba(255,255,255,.1)" stroke-width="1.5" stroke-dasharray="4 6"/>
    <!-- Drag path -->
    <path d="M286 176H398" stroke="url(#trail)" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.1 7"/>
    <path d="M390 169l8 7-8 7" stroke="#e6a243" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="copy">
    <b>Drag Headroom into Applications</b>
    <span>Then open it. It lives in your menu bar.</span>
  </div>
</body>
</html>
